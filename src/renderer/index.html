<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>myterminal</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-new" type="button" class="primary">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
          <span class="btn-label">新連接</span>
        </button>

        <span class="toolbar-sep"></span>

        <button id="btn-input" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3.5" width="12" height="9" rx="1.5"></rect>
            <path d="M4.5 7h5M4.5 9.5h3"></path>
          </svg>
          <span class="btn-label">輸入字</span>
        </button>

        <button id="btn-copy" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
            <path d="M3 10.5V3.5A1 1 0 0 1 4 2.5h7"></path>
          </svg>
          <span class="btn-label">複製文字</span>
        </button>

        <button id="btn-paste" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3.5" y="3.5" width="9" height="10.5" rx="1.5"></rect>
            <path d="M6 3.5V2.5h4v1"></path>
            <path d="M6 8h4M6 10.5h4"></path>
          </svg>
          <span class="btn-label">貼上</span>
        </button>

        <button id="btn-log" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="5.5"></circle>
            <circle class="icon-fill" cx="8" cy="8" r="2.2"></circle>
          </svg>
          <span class="btn-label">紀錄</span>
        </button>

        <span class="toolbar-spacer"></span>

        <select id="theme-select" title="主題" aria-label="主題">
          <option value="dark">深色</option>
          <option value="light">淺色</option>
          <option value="warm">暖色</option>
        </select>

        <button id="btn-clear" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4.5 12.5l6-6a1.5 1.5 0 0 1 2.1 0l.4.4a1.5 1.5 0 0 1 0 2.1l-3.5 3.5H4.5z"></path>
            <path d="M3 13.5h10"></path>
          </svg>
          <span class="btn-label">清除畫面</span>
        </button>
      </header>

      <main id="terminal-area">
        <div id="terminals"></div>
        <div id="empty-hint">還沒有工作階段，請按左上角的「新連接」。</div>
        <section id="input-panel" hidden>
          <p id="input-target">
            送到 <span id="input-target-name">—</span>
            <span id="input-target-dot" class="session-dot"></span>
          </p>
          <div class="input-row">
            <textarea
              id="input-text"
              rows="4"
              placeholder="在這裡編輯要送給 Claude / Codex 的長訊息，按「送出」一次送出。"
            ></textarea>
            <button id="btn-send" type="button" class="primary">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M14 2L7.4 8.6"></path>
                <path d="M14 2l-4.2 12-2.4-5.4L2 6.2z"></path>
              </svg>
              <span class="btn-label">送出</span>
            </button>
          </div>
        </section>
      </main>

      <aside id="session-panel">
        <header id="session-panel-head">
          <h2>工作階段</h2>
          <span id="session-count">0</span>
        </header>
        <ul id="session-list"></ul>

        <header id="profile-panel-head">
          <h2>已儲存連線</h2>
          <span id="profile-count">0</span>
        </header>
        <ul id="profile-list"></ul>

        <header id="workflow-panel-head">
          <h2>工作流</h2>
          <button id="btn-workflow-run" type="button">執行範本</button>
        </header>
        <ul id="workflow-list"></ul>
      </aside>
    </div>

    <dialog id="new-connection">
      <form method="dialog">
        <h2>新連接</h2>

        <label>
          類型
          <select id="f-type">
            <option value="powershell">PowerShell</option>
            <option value="wsl">WSL</option>
            <option value="ssh">SSH (plink)</option>
            <option value="claude">Claude</option>
            <option value="codex">Codex</option>
            <option value="agent">Agent 任務</option>
            <option value="custom">自訂命令</option>
          </select>
        </label>

        <label>
          名稱 <input id="f-name" type="text" placeholder="留空自動命名" />
        </label>

        <label>
          工作目錄 <input id="f-cwd" type="text" placeholder="留空使用預設目錄" />
        </label>

        <div class="field-group" data-for="wsl">
          <label>發行版 <input id="f-distro" type="text" placeholder="留空使用預設，例如 Ubuntu" /></label>
        </div>

        <div class="field-group" data-for="ssh">
          <label>主機 <input id="f-host" type="text" /></label>
          <label>連接埠 <input id="f-port" type="number" value="22" min="1" max="65535" /></label>
          <label>使用者 <input id="f-user" type="text" /></label>
        </div>

        <div class="field-group" data-for="agent">
          <label>
            基礎 shell
            <select id="f-base-shell">
              <option value="powershell">PowerShell</option>
              <option value="wsl">WSL</option>
            </select>
          </label>
          <label>啟動指令 <input id="f-startup" type="text" /></label>
        </div>

        <div class="field-group" data-for="agent-task">
          <label>
            執行者
            <select id="f-agent-kind">
              <option value="claude">Claude</option>
              <option value="codex">Codex</option>
            </select>
          </label>
          <label>
            任務
            <textarea id="f-agent-prompt" rows="4" placeholder="要 agent 做什麼"></textarea>
          </label>
          <label id="f-agent-edits-row">
            <input id="f-agent-edits" type="checkbox" />
            允許修改檔案
          </label>
        </div>

        <div class="field-group" data-for="custom">
          <label>執行檔 <input id="f-file" type="text" placeholder="例如 cmd.exe" /></label>
          <label>參數 <input id="f-args" type="text" placeholder="以空白分隔" /></label>
        </div>

        <label id="f-save-row">
          <input id="f-save" type="checkbox" />
          儲存此連線設定
        </label>

        <p id="f-errors" class="errors"></p>

        <menu>
          <button id="f-cancel" value="cancel" type="submit">取消</button>
          <button id="f-ok" value="ok" type="submit" class="primary">建立</button>
        </menu>
      </form>
    </dialog>

    <dialog id="workflow-run">
      <form method="dialog">
        <h2>執行工作流範本</h2>

        <label>
          範本
          <select id="w-template"></select>
        </label>

        <label>
          任務
          <textarea id="w-task" rows="4" placeholder="要 agent 做什麼"></textarea>
        </label>

        <label>
          工作目錄 <input id="w-cwd" type="text" placeholder="agent 會在這裡修改檔案" />
        </label>

        <p id="w-errors" class="errors"></p>

        <menu>
          <button id="w-cancel" value="cancel" type="submit">取消</button>
          <button id="w-ok" value="ok" type="submit" class="primary">開始</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
