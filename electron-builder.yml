appId: com.mufu.myterminal
productName: myterminal
directories:
  output: dist
# node-pty 1.1.0 內附 win32-x64 預先建置檔，ABI 與 electron@44.2.0 相容，
# 不需要（本機也沒有 Visual Studio 可以）從原始碼重建。
npmRebuild: false
files:
  - out/**/*
  - package.json
# 助理的知識檔不進 asar：AssistantService 是把路徑交給 claude 的
# --append-system-prompt-file，claude 讀得到的必須是真實檔案。
extraResources:
  - from: docs/ASSISTANT.md
    to: ASSISTANT.md
# node-pty 的 .node、conpty.dll、OpenConsole.exe 以及 fork 出來的
# conpty_console_list_agent.js 都必須是真實檔案，不能留在 asar 裡。
asarUnpack:
  - node_modules/node-pty/**
win:
  target:
    - portable
    - nsis
    - zip
  # zip 沒有自己的設定區塊，就用 win 這一層的名字；
  # portable 與 nsis 各自蓋掉它 (見下面)。
  artifactName: ${name}-${version}-win.${ext}
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
